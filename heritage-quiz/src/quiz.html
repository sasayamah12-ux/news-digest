<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>世界遺産 国あてクイズ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column. Picture first, then a 2x2 grid of flag tiles; the answer notes open below the tiles. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #15203a;
  --muted: #5b6880;
  --line: #d2dae6;
  --accent: #2a4bd0;
  --accent-ink: #ffffff;
  --ok: #1b8a52;
  --ok-bg: #e2f4ea;
  --bad: #c23a2e;
  --bad-bg: #fbe6e3;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1424;
    --surface: #161f33;
    --ink: #e7ecf6;
    --muted: #9aa7c0;
    --line: #2b3654;
    --accent: #8aa9ff;
    --accent-ink: #0d1424;
    --ok: #4cc790;
    --ok-bg: #12301f;
    --bad: #ff8a7d;
    --bad-bg: #3a1a18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1424;
  --surface: #161f33;
  --ink: #e7ecf6;
  --muted: #9aa7c0;
  --line: #2b3654;
  --accent: #8aa9ff;
  --accent-ink: #0d1424;
  --ok: #4cc790;
  --ok-bg: #12301f;
  --bad: #ff8a7d;
  --bad-bg: #3a1a18;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 20px 36px;
}
.app { width: 100%; max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 15px; letter-spacing: .06em; }
.count { margin: 0; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-size: 17px; font-weight: 700; }

.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease-out; } }

#stage { display: flex; flex-direction: column; gap: 14px; outline: none; }

.shot { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #1c2236; }
.shot > svg { width: 100%; height: 100%; display: block; }
/* 写真は横スクロール(スワイプ)で切り替える。1枚ずつぴったり止まる。 */
.slides { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; outline: none; }
.slides::-webkit-scrollbar { display: none; }
.slides img { flex: 0 0 100%; width: 100%; height: 100%; display: block; object-fit: cover; scroll-snap-align: start; scroll-snap-stop: always; }
.dots { position: absolute; right: 10px; bottom: 13px; display: flex; gap: 6px; pointer-events: none; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .5); box-shadow: 0 0 0 1px rgba(10, 16, 32, .25); }
.dots i[data-on] { background: #fff; }
.slide-btn { display: none; position: absolute; top: 50%; width: 34px; height: 34px; margin-top: -17px; border: 0; border-radius: 50%; background: rgba(10, 16, 32, .5); color: #fff; font: 700 18px/1 var(--font-body); cursor: pointer; }
.slide-btn.prev { left: 8px; }
.slide-btn.next2 { right: 8px; }
.slide-btn[disabled] { opacity: 0; pointer-events: none; }
.slide-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) and (pointer: fine) { .slide-btn { display: block; } }
.chip { position: absolute; left: 10px; bottom: 10px; padding: 2px 10px; border-radius: 999px; background: rgba(10, 16, 32, .6); color: #fff; font-size: 11px; letter-spacing: .08em; }

.stamp {
  position: absolute; top: 12px; right: 12px;
  width: 78px; height: 78px; border-radius: 50%;
  display: grid; place-items: center;
  border: 3px solid currentColor;
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--surface) 80%, transparent), inset 0 0 0 4.5px currentColor;
  background: color-mix(in srgb, var(--surface) 84%, transparent);
  font-family: var(--font-display); font-weight: 800; letter-spacing: .04em;
  transform: rotate(-10deg);
}
.stamp.ok { color: var(--ok); font-size: 22px; }
.stamp.bad { color: var(--bad); font-size: 16px; }
@media (prefers-reduced-motion: no-preference) {
  .stamp { animation: stamp-in .32s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes stamp-in { from { transform: rotate(-22deg) scale(1.7); opacity: 0; } to { transform: rotate(-10deg) scale(1); opacity: 1; } }
  .reveal { animation: rise .28s ease-out both; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
}

.question { margin: 2px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.4; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 65ch; }

.choices { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices li { min-width: 0; display: flex; }
.tile {
  position: relative; flex: 1; min-width: 0; min-height: 96px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  padding: 12px; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--ink); font: inherit;
  border: 1.5px solid var(--line); border-radius: 12px;
}
.choices:not([data-locked]) .tile:hover { border-color: var(--accent); }
.choices[data-locked] .tile { cursor: default; }
.tile:focus-visible, .next:focus-visible, .mode:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile .ja { font-weight: 700; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.tile .en { color: var(--muted); font-size: 11px; letter-spacing: .05em; }
.tile[data-state="ok"] { border-color: var(--ok); background: var(--ok-bg); }
.tile[data-state="bad"] { border-color: var(--bad); background: var(--bad-bg); }
.tile[data-state="dim"] { opacity: .5; }
.tile[data-state="ok"]::after, .tile[data-state="bad"]::after {
  position: absolute; top: 8px; right: 12px;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1;
}
.tile[data-state="ok"]::after { content: "○"; color: var(--ok); }
.tile[data-state="bad"]::after { content: "×"; color: var(--bad); }

.flag { flex: none; display: block; width: 54px; aspect-ratio: 3 / 2; line-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 3px; background: #fff; }
.flag svg { width: 100%; height: 100%; display: block; }
.flag.sm { width: 30px; }

.mode {
  width: 100%; display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
  padding: 14px 16px; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
}
.mode:hover { border-color: var(--accent); }
.mode .mt { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.mode .ms { color: var(--muted); font-size: 13px; }

.reveal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.verdict { margin: 0; font-weight: 700; font-size: 14px; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.site { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.4; text-wrap: balance; }
.meta { margin: 0; color: var(--muted); font-size: 12.5px; }
.note { margin: 4px 0 8px; max-width: 65ch; }
.next {
  width: 100%; min-height: 48px; padding: 12px 16px; border: 0; border-radius: 12px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; font-size: 15px;
}

.result { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .12em; }
.score { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score small { font-size: 22px; color: var(--muted); font-weight: 600; }
.msg { margin: 0 0 4px; }
.log { margin: 0 0 8px; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.log li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log .mark { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.log .mark.bad { color: var(--bad); }
.log .logsite { min-width: 0; font-weight: 500; line-height: 1.4; }
.log .logans { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

.credit { margin: 0 0 8px; color: var(--muted); font-size: 11.5px; line-height: 1.6; overflow-wrap: anywhere; }
.credit a { color: inherit; }
.foot { margin: 4px 0 0; color: var(--muted); font-size: 11.5px; line-height: 1.7; }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <p class="brand">世界遺産 国あてクイズ</p>
    <p class="count" id="count"></p>
  </header>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  <main id="stage" tabindex="-1"></main>
  <p class="foot">ランキングは、PR TIMESに掲載された「勉強して行きたくなった世界遺産 TOP50」をもとにしています。同順位を含めて57件ある中から、複数の国にまたがるものと、絵にするのが難しいものを除いた50件を採用しました。追加の50件は、写真で見分けやすい遺産を選んでいます(複数の国にまたがるものは除外)。<span id="footimg">画像は簡略化したイラスト</span>、国旗も簡略化した図です。</p>
</div>

      '<p class="meta">' + q.place + ' ・ ' + q.year + '年登録(' + q.kind + ')</p>' +
      '<p class="note">' + q.note + '</p>' + credit(q.scene) +
      '<button class="next" id="next" type="button">' + (last ? '結果を見る' : '次の問題へ') + '</button>';
    rv.hidden = false;
    rv.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
    document.getElementById('next').addEventListener('click', function () {
      if (last) { renderResult(); } else { idx++; renderQuestion(); }
      stage.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    });
  }

  function renderResult() {
    idx = quiz.length; answered = false;
    countEl.innerHTML = '結果';
    barEl.style.width = '100%';
    var r = score / quiz.length;
    var msg = r === 1 ? '全問正解です。国旗と風景の組み合わせがばっちり頭に入っています。'
      : r >= 0.7 ? 'とても良い結果です。間違えた遺産をもう一度見直してみましょう。'
      : r >= 0.4 ? 'いい調子です。もう一度挑戦すると、さらに覚えやすくなります。'
      : '惜しい結果でした。国旗を手がかりにすると当てやすくなります。';
    var rows = missed.map(function (q) {
      return '<li><span class="mark bad" aria-label="不正解">×</span>' +
        '<span class="logsite">' + q.site + '</span>' +
        '<span class="logans"><span class="flag sm">' + FLAGS[q.answer] + '</span>' + NAMES[q.answer][0] + '</span></li>';
    }).join('');
    stage.innerHTML =
      '<section class="result"><p class="eyebrow">今回のスコア</p>' +
      '<p class="score">' + score + '<small> / ' + quiz.length + '</small></p>' +
      '<p class="msg">' + msg + '</p>' +
      (missed.length ? '<p class="eyebrow">まちがえた遺産(' + missed.length + ')</p><ul class="log">' + rows + '</ul>' : '') +
      '<button class="next" id="again" type="button">もう一度あそぶ</button></section>';
    document.getElementById('again').addEventListener('click', function () {
      renderIntro();
      stage.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (answered || !quiz.length || idx >= quiz.length || e.metaKey || e.ctrlKey || e.altKey) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) {
      var tiles = document.querySelectorAll('#choices .tile');
      if (tiles[n - 1]) pick(tiles[n - 1].getAttribute('data-code'));
    }
  });

  renderIntro();
})();
</script>
</body>
</html>
