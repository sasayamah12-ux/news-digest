name: Heritage quiz photo candidates

# Wikimedia Commons から写真候補を集め、heritage-quiz/candidates/ にコミットする。
# 手動実行(ids を空にすると全50件)か、検索キーワード(sites.csv)の変更で動く。
on:
  workflow_dispatch:
    inputs:
      ids:
        description: '対象の id(空白区切り、空なら全件)'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths:
      - 'heritage-quiz/sites.csv'
      - 'heritage-quiz/fetch_candidates.py'
      - '.github/workflows/heritage-quiz-candidates.yml'

permissions:
  contents: write

concurrency:
  group: heritage-quiz-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python heritage-quiz/fetch_candidates.py ${{ inputs.ids }}
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heritage-quiz/candidates heritage-quiz/candidates.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update heritage quiz photo candidates"
          git push
